# Explicit SSE-C overlay for docker-compose.prod.yml. Both production writers
# receive the same read-only key file. Service-derived auditverify commands use
# this overlay; a networkless configcheck needs the equivalent direct file bind
# documented in DEPLOY.md. The estate automation does not consume this overlay
# yet, so it remains a production HOLD until that workflow is wired and tested.
secrets:
  hash-s3-sse-c:
    file: ${HASH_S3_SSE_C_KEY_HOST_FILE:?set HASH_S3_SSE_C_KEY_HOST_FILE to the raw 32-byte host key file}

services:
  hash:
    environment:
      HASH_S3_USE_SSL: "true"
      HASH_S3_SSE_MODE: sse-c
      HASH_S3_SSE_C_KEY_FILE: /run/secrets/hash-s3-sse-c
    secrets:
      - hash-s3-sse-c

  hash-worker:
    environment:
      HASH_S3_USE_SSL: "true"
      HASH_S3_SSE_MODE: sse-c
      HASH_S3_SSE_C_KEY_FILE: /run/secrets/hash-s3-sse-c
    secrets:
      - hash-s3-sse-c
