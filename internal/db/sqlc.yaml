version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "generated"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - db_type: "inet"
            go_type:
              type: "string"
              pointer: true
          # Column-level overrides - sqlc has a known issue where some columns
          # added via ALTER TABLE / CHECK constraints don't pick up the global
          # jsonb override and emit []byte. Same workaround pattern as brightcrm.
          - column: "templates.blocks_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "documents.blocks_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "document_versions.block_tree_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "document_versions.variables_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "block_embeddings.embedding"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "documents.metadata_redaction_report"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "eidas_routing_rules.predicate_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - column: "document_proposals.diff_json"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
