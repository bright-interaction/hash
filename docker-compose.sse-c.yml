# Explicit SSE-C overlay for the bundled/standalone compose stack.
# HASH_S3_SSE_C_KEY_HOST_FILE is a path only; Docker mounts its bytes as a
# read-only service secret, never an environment value. Do not use this file with
# docker-compose.prod.yml, whose worker service has a different name.
secrets:
  hash-s3-sse-c:
    file: ${HASH_S3_SSE_C_KEY_HOST_FILE:?set HASH_S3_SSE_C_KEY_HOST_FILE to the raw 32-byte host key file}

services:
  hash:
    environment:
      HASH_S3_ENDPOINT: ${HASH_S3_ENDPOINT:?set the external S3 endpoint without a URL scheme}
      HASH_S3_REGION: ${HASH_S3_REGION:?set the external S3 region}
      HASH_S3_BUCKET: ${HASH_S3_BUCKET:?set the external S3 bucket}
      HASH_S3_ACCESS_KEY: ${HASH_S3_ACCESS_KEY:?set the external S3 access key}
      HASH_S3_SECRET_KEY: ${HASH_S3_SECRET_KEY:?set the external S3 secret key}
      HASH_S3_USE_SSL: "true"
      HASH_S3_SSE_MODE: sse-c
      HASH_S3_SSE_C_KEY_FILE: /run/secrets/hash-s3-sse-c
      HASH_S3_BUCKET_LOOKUP: ${HASH_S3_BUCKET_LOOKUP:?set auto, path, or dns for the external S3 provider}
    secrets:
      - hash-s3-sse-c

  worker:
    environment:
      HASH_S3_ENDPOINT: ${HASH_S3_ENDPOINT:?set the external S3 endpoint without a URL scheme}
      HASH_S3_REGION: ${HASH_S3_REGION:?set the external S3 region}
      HASH_S3_BUCKET: ${HASH_S3_BUCKET:?set the external S3 bucket}
      HASH_S3_ACCESS_KEY: ${HASH_S3_ACCESS_KEY:?set the external S3 access key}
      HASH_S3_SECRET_KEY: ${HASH_S3_SECRET_KEY:?set the external S3 secret key}
      HASH_S3_USE_SSL: "true"
      HASH_S3_SSE_MODE: sse-c
      HASH_S3_SSE_C_KEY_FILE: /run/secrets/hash-s3-sse-c
      HASH_S3_BUCKET_LOOKUP: ${HASH_S3_BUCKET_LOOKUP:?set auto, path, or dns for the external S3 provider}
    secrets:
      - hash-s3-sse-c
