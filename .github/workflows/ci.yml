# CI for the public fair-code repo.
#
# The source-quality checks live in scripts/ci.sh, which you can run yourself:
#
#   bash scripts/ci.sh
#
# The integration jobs below add real Postgres, object storage, the custom Chromium
# renderer, and browser checks around that reproducible core. This repository is a
# filtered mirror published by a job that authenticates with a repository deploy key,
# which GitHub does not permit to create or update anything under .github/workflows/.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act and needs
# a push from a credential holding the `workflow` scope.
name: ci

on:
  schedule:
    # Rebuild and rescan even when no source changes, so newly disclosed
    # Chromium/OS/Go advisories cannot wait for the next feature commit.
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the secret scan reads full history, not just the tip

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install pinned sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: All checks (backend, frontend, licenses, secrets, vulnerabilities)
        env:
          HASH_CI_REQUIRE_ALL: '1'
        run: bash scripts/ci.sh

  # End-to-end send -> sign -> stamped-PDF and transactional integrity suites
  # against real Postgres + MinIO + Hash's API+Chromium-only renderer. E2E-tagged
  # tests skip unless their HASH_E2E_* environment is present, so they do not run
  # in the unit suite above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Build the minimal Hash renderer
        run: docker build --file gotenberg/Dockerfile --tag hash-gotenberg:e2e .

      - name: Start E2E dependencies
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=hash -e POSTGRES_PASSWORD=e2e -e POSTGRES_DB=hash \
            postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_KMS_SECRET_KEY=hash-e2e-key:qUUkXGsPxO6Vaay3hRuFTBdvO4dikHtLiin3Oy2hnV0= \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          docker run -d --name gotenberg -p 3000:3000 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=536870912,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            hash-gotenberg:e2e

      - name: Wait for E2E dependencies
        run: |
          wait_for() {
            name="$1"
            shift
            for i in $(seq 1 60); do
              if "$@"; then return 0; fi
              sleep 1
            done
            echo "$name did not become ready" >&2
            return 1
          }
          wait_for postgres docker exec pg pg_isready -U hash -d hash
          wait_for minio curl -sf http://localhost:9000/minio/health/ready
          wait_for gotenberg curl -sf http://localhost:3000/health

      - name: Run module-wide E2E
        env:
          HASH_E2E_DB_URL: postgres://hash:e2e@localhost:5432/hash?sslmode=disable
          HASH_E2E_S3_ENDPOINT: localhost:9000
          HASH_E2E_S3_ACCESS_KEY: minioadmin
          HASH_E2E_S3_SECRET_KEY: minioadmin
          HASH_E2E_S3_EPHEMERAL_BUCKET: 'true'
          HASH_E2E_GOTENBERG_URL: http://localhost:3000
        run: go test -tags e2e -count=1 -timeout=180s ./...

      - name: Collect E2E dependency logs
        if: failure()
        run: |
          for container in pg minio gotenberg; do
            docker logs --tail=200 "$container" || true
          done

      - name: Stop E2E dependencies
        if: always()
        run: |
          for container in pg minio gotenberg; do
            docker rm --force "$container" || true
          done

  browser-e2e:
    # The live test may only exercise images after both source and module E2E
    # are green. It scans the exact IDs used by the running containers.
    needs: [build-test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.local-minio.yml
      HASH_APP_PORT: '8080'
      # Public test-only fixture. CI mints a normal signed cookie and the
      # server reloads the fixed user from Postgres on every session request.
      HASH_SESSION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Build the exact app and renderer images once
        run: docker compose build hash gotenberg

      - name: Start the live Hash signing stack without rebuilding
        # Starting server+worker together deliberately exercises the shared
        # bucket-create path that previously raced on an empty MinIO instance.
        run: docker compose up -d --no-build postgres minio gotenberg mailhog webhook-sink hash worker

      - name: Scan the exact running app and renderer images
        run: |
          set -eu
          app_id="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q hash)")"
          worker_app_id="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q worker)")"
          renderer_id="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q gotenberg)")"
          if test "$worker_app_id" != "$app_id"; then
            echo "server and worker are not running the same app image" >&2
            exit 1
          fi
          for image_id in "$app_id" "$renderer_id"; do
            printf '%s\n' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
              echo "refusing to scan non-exact image identity: $image_id" >&2
              exit 1
            }
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v hash-trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --severity HIGH,CRITICAL --pkg-types os,library \
              --scanners vuln --exit-code 1 --format table "$image_id"
          done

      - name: Wait for stack readiness and worker stability
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null

          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/api/v2/messages >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8025/api/v2/messages >/dev/null

          worker_id="$(docker compose ps -q worker)"
          test -n "$worker_id"
          for i in $(seq 1 60); do
            if test "$(docker inspect -f '{{.State.Running}}' "$worker_id")" = true; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Running}}' "$worker_id")" = true
          restarts_before="$(docker inspect -f '{{.RestartCount}}' "$worker_id")"
          sleep 6
          restarts_after="$(docker inspect -f '{{.RestartCount}}' "$worker_id")"
          test "$restarts_after" = "$restarts_before"

      - name: Seed the non-secret browser-test API identity
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U hash -d hash --command "
            WITH created_org AS (
              INSERT INTO orgs (id, name, plan)
              VALUES ('11111111-1111-4111-8111-111111111111', 'Hash CI Browser', 'starter')
              RETURNING id
            ), created_user AS (
              INSERT INTO users (id, org_id, email, name, role)
              SELECT '22222222-2222-4222-8222-222222222222', id,
                     'browser-ci@example.invalid', 'Browser CI', 'owner'
              FROM created_org
              RETURNING id, org_id
            ), created_subscription AS (
              INSERT INTO org_subscriptions (
                org_id, plan_id, provider, status,
                current_period_start, current_period_end, trial_ends_at
              )
              SELECT id,
                     (SELECT id FROM billing_plans WHERE slug = 'enterprise'),
                     'mock', 'trialing', now(), now() + interval '1 day',
                     now() + interval '1 day'
              FROM created_org
              RETURNING org_id
            )
            INSERT INTO api_keys (org_id, user_id, key_prefix, key_hash, name, scopes)
            SELECT created_user.org_id, created_user.id, 'deadbeef',
                   decode('becbd0c28e61490c73e9c87c438bfe0c5fbe9d1e55b17e408995cef20ce115f0', 'hex'),
                   'Browser CI', ARRAY['read', 'write:authoring', 'write:workflow']::text[]
            FROM created_user
            JOIN created_subscription USING (org_id);
          "

      - name: Mint a real signed session cookie for sender-only routes
        run: |
          cookie="$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import struct
          import time

          payload = json.dumps({
              'u': '22222222-2222-4222-8222-222222222222',
          }, separators=(',', ':')).encode()
          body = payload + struct.pack('>q', int(time.time()) + 7200)
          key = bytes.fromhex(os.environ['HASH_SESSION_KEY'])
          tag = hmac.new(key, body, hashlib.sha256).digest()
          encode = lambda value: base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          print(f'hash_session={encode(body)}.{encode(tag)}')
          PY
          )"
          printf 'HASH_E2E_SESSION_COOKIE=%s\n' "$cookie" >> "$GITHUB_ENV"

      - name: Install pinned Playwright dependencies
        run: |
          bun install --frozen-lockfile
          bun audit
          bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Full live browser and API regression suite
        env:
          CI: '1'
          HASH_E2E_URL: http://127.0.0.1:8080
          HASH_E2E_API_KEY: mth_deadbeef_TESTKEYFORINTEGRATIONTESTINGONLY12345AAAAAAA
          HASH_LANDING: '1'
        run: bun run test
        working-directory: e2e

      - name: Verify worker dispatched signing email
        run: |
          for i in $(seq 1 30); do
            messages="$(curl --fail --silent --show-error http://127.0.0.1:8025/api/v2/messages)"
            if jq -e '.total > 0' >/dev/null <<<"$messages"; then
              exit 0
            fi
            sleep 1
          done
          echo 'worker did not dispatch any signing email to MailHog' >&2
          exit 1

      - name: Collect stack logs
        if: failure()
        run: docker compose logs --tail=200 hash worker postgres minio gotenberg mailhog webhook-sink

      - name: Stop the browser-test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
